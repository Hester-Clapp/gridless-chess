<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gridless Chess</title>
    <style>
        #game {
            width: 90vh;
            margin: auto;
        }

        canvas {
            display: block;
            width: 100%;
            height: 90vh;
            border: 4px solid black;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
        }

        #status {
            font-family: sans-serif;
            font-size: 1.5rem;
            text-align: center;
            margin: 0.25em 0;
        }

        #status.check {
            color: rgb(220, 40, 40);
            font-weight: bold;
        }

        #status.winner {
            color: rgb(30, 140, 60);
            font-weight: bold;
        }

        .hidden {
            display: none;
        }

        #queue {
            font-family: sans-serif;
            font-size: 1.25rem;
            text-align: center;
            margin-top: 40vh;
        }

        .spinner {
            margin: 1em auto;
            width: 2rem;
            height: 2rem;
            border: 4px solid #ccc;
            border-top-color: #333;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        #play-again {
            display: block;
            margin: 0.75em auto 0;
            font-size: 1rem;
            padding: 0.5em 1.5em;
        }
    </style>
</head>
<body>
    <div id="queue">
        <p>Waiting for an opponent…</p>
        <div class="spinner"></div>
    </div>
    <div id="game" class="hidden">
        <div id="status"></div>
        <canvas id="board" width="800" height="800"></canvas>
        <button id="play-again" class="hidden">Play again</button>
    </div>
    <script type="module" src="main.js"></script>
</body>
</html>
