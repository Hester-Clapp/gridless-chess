<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gridless Chess</title>
    <style>
        #game {
            width: 90vh;
            margin: auto;
        }

        #board-wrap {
            position: relative;
            width: 100%;
            height: 90vh;
            border: 4px solid black;
            box-sizing: border-box;
        }

        canvas {
            display: block;
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
        }

        /* Sits over the canvas, same box exactly - see PieceLayer. Pointer
           events pass through it to the canvas underneath, which is still
           what drag input is wired to (see PointerInputBinder). */
        #pieces {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .piece {
            position: absolute;
            border-radius: 50%;
            --outline-w: calc(var(--unit, 1px) * 2);
            outline: var(--outline-w) solid lightgrey;
            outline-offset: calc(var(--outline-w) / -2);
            transition: left 150ms ease, top 150ms ease;
        }

        /* While a piece is being actively dragged it must track the pointer
           exactly - see PieceLayer, which toggles this on the piece the
           current DragGesture has selected. */
        .piece.dragging {
            transition: none;
        }

        .piece.hl-piece { outline-color: hsl(200, 75%, 48%); } /* cyan - piece being dragged / last moved */
        .piece.hl-capture { outline-color: hsl(355, 75%, 48%); } /* red - piece about to be captured / delivering check */
        .piece.hl-check { --outline-w: calc(var(--unit, 1px) * 4); }
        .piece.hl-threat { outline-color: hsl(50, 75%, 48%); } /* yellow - piece delivering check */

        .piece-img {
            width: 100%;
            height: 100%;
            display: block;
        }

        #status {
            font-family: sans-serif;
            font-size: 1.5rem;
            text-align: center;
            margin: 0.25em 0;
        }

        #status.check {
            color: rgb(220, 40, 40);
            font-weight: bold;
        }

        #status.winner {
            color: rgb(30, 140, 60);
            font-weight: bold;
        }

        .hidden {
            display: none;
        }

        #queue {
            font-family: sans-serif;
            font-size: 1.25rem;
            text-align: center;
            margin-top: 40vh;
        }

        .spinner {
            margin: 1em auto;
            width: 2rem;
            height: 2rem;
            border: 4px solid #ccc;
            border-top-color: #333;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        #play-again {
            display: block;
            margin: 0.75em auto 0;
            font-size: 1rem;
            padding: 0.5em 1.5em;
        }
    </style>
</head>
<body>
    <div id="queue">
        <p>Waiting for an opponent…</p>
        <div class="spinner"></div>
    </div>
    <div id="game" class="hidden">
        <div id="status"></div>
        <div id="board-wrap">
            <canvas id="board" width="800" height="800"></canvas>
            <div id="pieces"></div>
        </div>
        <button id="play-again" class="hidden">Play again</button>
    </div>
    <script type="module" src="main.js"></script>
</body>
</html>
