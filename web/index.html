<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gridless Chess</title>
    <style>
        #game {
            width: 90vh;
            margin: auto;
        }

        canvas {
            display: block;
            width: 100%;
            height: 90vh;
            border: 4px solid black;
        }

        #status {
            font-family: sans-serif;
            font-size: 1.5rem;
            text-align: center;
            margin: 0.25em 0;
        }

        #status.check {
            color: rgb(220, 40, 40);
            font-weight: bold;
        }

        #status.winner {
            color: rgb(30, 140, 60);
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="game">
        <div id="status"></div>
        <canvas id="board" width="800" height="800"></canvas>
    </div>
    <script type="module" src="main.js"></script>
</body>
</html>
